
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Calculator</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>🎰 Gacha Calculator</h1>
        <p class="subtitle">Calcule quanto tempo seu dinheiro vai durar.</p>

        <div class="field">
            <label for="money">💸 Dinheiro disponível</label>
            <input
                type="text"
                id="money"
                value="100M"
                placeholder="Ex: 100K, 10M, 1B"
            >
        </div>

        <div class="grid">
            <div class="field">
                <label for="stars">⭐ Estrelas por giro</label>
                <input
                    type="number"
                    id="stars"
                    value="2"
                    min="1"
                >
            </div>

            <div class="field">
                <label for="seconds">⏱️ Tempo por giro (segundos)</label>
                <input
                    type="number"
                    id="seconds"
                    value="5.5"
                    min="0.001"
                    step="0.1"
                >

                <div class="time-buttons">
                    <button type="button" id="fastButton">
                        ⚡ Fast Open
                    </button>

                    <button type="button" id="normalButton">
                        ⏱️ Normal
                    </button>
                </div>
            </div>
        </div>

        <div class="field">
            <label for="cost">💰 Custo por estrela</label>
            <input
                type="text"
                id="cost"
                value="200K"
                placeholder="Ex: 100K, 1M, 1B"
            >
        </div>

        <div class="results">
            <p class="result-title">⏳ TEMPO TOTAL DE AUTONOMIA</p>

            <div class="time" id="time">
                00h 00min 00s
            </div>

            <div class="stats">
                <div class="stat">
                    <span>🎰 Total de giros</span>
                    <strong id="spins">0</strong>
                </div>

                <div class="stat">
                    <span>🌟 Estrelas obtidas</span>
                    <strong id="totalStars">0</strong>
                </div>

                <div class="stat">
                    <span>💸 Custo por giro</span>
                    <strong id="spinCost">0</strong>
                </div>

                <div class="stat">
                    <span>🪙 Dinheiro restante</span>
                    <strong id="remaining">0</strong>
                </div>
            </div>
        </div>

        <button id="resetButton">
            🔄 Restaurar configurações
        </button>

        <p class="footer">
            Gacha Time Calculator • Cálculo automático
        </p>
    </div>

</body>
</html>
