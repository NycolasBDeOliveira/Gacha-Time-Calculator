
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Calculator</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>🎰 Gacha Calculator</h1>

            <div class="language-switch">
                <button type="button" class="language-btn active" data-lang="pt">🇧🇷 PT</button>
                <button type="button" class="language-btn" data-lang="en">🇺🇸 EN</button>
                <button type="button" class="language-btn" data-lang="es">🇪🇸 ES</button>
            </div>
        </div>

        <p class="subtitle" data-i18n="subtitle">
            Calcule por quanto tempo seu dinheiro será suficiente para roletar.
        </p>

        <div class="field">
            <label for="money" data-i18n="moneyLabel">💸 Dinheiro disponível</label>
            <input
                type="text"
                id="money"
                value="0"
                placeholder="Ex: 100K, 10M, 1B"
                data-i18n-placeholder="moneyPlaceholder"
            >
        </div>

        <div class="field stars-field">
            <label for="stars" data-i18n="starsLabel">⭐ Estrelas por abertura</label>
            <input
                type="number"
                id="stars"
                class="stars-input"
                value="1"
                min="1"
                step="1"
            >
        </div>

        <div class="field">
            <label for="speed" data-i18n="speedLabel">⚡ Velocidade</label>
            <select id="speed">
                <option value="1" selected>Normal (1x)</option>
                <option value="2">Fast Open (2x)</option>
                <option value="1.25">25% (1,25x)</option>
                <option value="2.5">Fast Open + 25% (2,5x)</option>
            </select>
        </div>

        <div class="field">
            <label for="vip" data-i18n="vipLabel">👑 Gamepass VIP</label>
            <select id="vip">
                <option value="0" selected>Desativado</option>
                <option value="1">Ativado (25% de desconto)</option>
            </select>
        </div>

        <div class="field">
            <label for="world" data-i18n="worldLabel">🌎 Mundo / Custo por estrela</label>
            <select id="world">
                <option value="80">Mundo 1 — 80</option>
                <option value="300">Mundo 2 — 300</option>
                <option value="2500">Mundo 3 — 2,5K</option>
                <option value="12500">Mundo 4 — 12,5K</option>
                <option value="50000">Mundo 5 — 50K</option>
                <option value="200000">Mundo 6 — 200K</option>
                <option value="1150000">Mundo 7 — 1.150M</option>
            </select>
        </div>

        <div class="results">
            <p class="result-title" data-i18n="resultTitle">
                ⏳ RESULTADO DO CÁLCULO
            </p>

            <div class="time" id="time">0h 00min 00s</div>

            <div class="stats">
                <div class="stat">
                    <span data-i18n="spinsLabel">🎰 Total de aberturas</span>
                    <strong id="spins">0</strong>
                </div>

                <div class="stat">
                    <span data-i18n="totalStarsLabel">🌟 Total de estrelas</span>
                    <strong id="totalStars">0</strong>
                </div>

                <div class="stat">
                    <span data-i18n="costLabel">💰 Dinheiro utilizado</span>
                    <strong id="spinCost">0</strong>
                </div>

                <div class="stat">
                    <span data-i18n="remainingLabel">🪙 Dinheiro restante</span>
                    <strong id="remaining">0</strong>
                </div>
            </div>
        </div>

        <button id="resetButton" data-i18n="resetButton">
            🔄 Restaurar configurações
        </button>

        <p class="footer" data-i18n="footer">
            Gacha Time Calculator • Cálculo automático
        </p>

    </div>

</body>
</html>
